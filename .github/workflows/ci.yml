name: verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify generated artifacts are reproducible
        run: |
          python3 scripts/database_manifest.py > /tmp/catalog-before.json
          make generate
          python3 scripts/database_manifest.py > /tmp/catalog-after.json
          cmp /tmp/catalog-before.json /tmp/catalog-after.json
          git diff --exit-code -- . ':!data/travel.sqlite3'
      - run: make vet race build
      - run: pip install -r requirements-dev.txt
      - name: Validate the running API and OpenAPI contract
        run: |
          REFERENCE_DATE=2026-10-20 ./bin/travel-api > /tmp/travel-api.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:8080/healthz > /dev/null; then break; fi
            sleep 1
          done
          make verify
